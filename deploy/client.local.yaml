# Client config matching the local docker-compose stack (TLS 1.3 + mTLS).
# Paths resolve relative to the repo root; the certs are the ones the server
# container generates on first boot into security/certs/.
#
#     python -m client.main --gui --config deploy/client.local.yaml

host: "127.0.0.1"
port: 9443
prefer_ipv6: false
require_tls: true

ca_file: "security/certs/ca.pem"
certfile: "security/certs/cscp-client.pem"
keyfile: "security/certs/cscp-client.key"

ping_interval: 20.0
idle_timeout: 60.0
connect_timeout: 8.0
reconnect_backoff_base: 1.0
reconnect_backoff_max: 30.0

client_id: "cscp-py-client"
device_name: "cscp-py"
capabilities: ["e2ee", "files", "channels", "sync"]

data_dir: "data/client"
