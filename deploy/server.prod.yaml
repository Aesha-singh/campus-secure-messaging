# Production CSCP server configuration.
# Copy next to the code (or mount at /app/config/config.yaml) and edit paths.
# Secrets are NOT in this file -- see deploy/.env / the systemd EnvironmentFile.

server_name: "campus-cscp-prod"

net:
  enable_v4: true
  host_v4: "0.0.0.0"
  enable_v6: true
  host_v6: "::"
  port: 9443

tls:
  certfile: "security/certs/server.pem"
  keyfile: "security/certs/server.key"
  ca_file: "security/certs/ca.pem"
  require_client_cert: true       # mutual TLS -- clients must present CA-signed certs
  min_version: "TLSv1_3"
  ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"

limits:
  max_connections: 5000
  max_frame_size: 16777216
  write_queue_size: 512
  close_timeout: 3.0
  max_username_len: 64
  max_message_bytes: 524288

heartbeat:
  ping_interval: 30.0
  idle_timeout: 90.0
  max_missed_pings: 3

auth:
  backend: "argon2"               # production: Argon2id + optional TOTP
  userdb: "security/users.yaml"
  max_attempts: 5
  lockout_seconds: 300
  token_ttl_seconds: 300
  session_resume_ttl_seconds: 604800
  totp_enabled: true

rate:
  per_ip:
    capacity: 120
    refill_per_sec: 40
  per_user:
    capacity: 300
    refill_per_sec: 100
  auth_window_seconds: 300
  auth_max_per_window: 20

storage:
  db_path: "data/campus.db"
  wal: true
  history_limit: 200

files:
  enabled: true
  max_size_bytes: 209715200
  quota_bytes: 2147483648
  ttl_seconds: 604800
  chunk_size: 65536
  relay_encrypted_blobs_dir: "data/blobs"

logging:
  level: "INFO"
  json: true
  file: "logs/server.log"
  stderr: false

# Admin plane: loopback only; behind a firewall/reverse-proxy in production.
admin:
  enable: true
  host_v4: "127.0.0.1"
  port: 9444
  require_auth: true
  auth_token_env: "CSCP_ADMIN_TOKEN"

admin_password_env: "CSCP_ADMIN_PASSWORD"