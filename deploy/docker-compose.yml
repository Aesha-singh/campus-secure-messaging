# Turnkey single-node CSCP server for local use and the demo/viva.
#
#   make up        # (from the repo root) copies .env if needed, builds, starts
#   docker compose up --build           # or run it directly from deploy/
#
# On first boot the container generates a self-contained PKI (CA + server +
# client leaf) under ../security/certs and provisions demo accounts, so TLS 1.3
# + mTLS and login work immediately with zero manual setup.
#
# Demo logins: alice / bob, password from CSCP_DEMO_PASSWORD (default
# "campus-demo1").  Uses the production Argon2id backend.
services:
  cscp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cscp-server:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9443:9443"            # CSCP protocol (TLS 1.3 + mTLS) -- expose to LAN
      - "127.0.0.1:9444:9444"  # admin dashboard -- loopback only
    volumes:
      - ./server.local.yaml:/app/config/config.yaml:ro  # demo config (Argon2id + mTLS)
      - ../security/certs:/app/security/certs   # writable: PKI bootstrap on first boot
      - ../data:/app/data                        # SQLite + relayed blobs (persist)
      - ../logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
