# CSCP desktop / console client configuration.
# Credentials are intentionally NOT stored here -- they come from the caller
# or the CSCP_PASSWORD / CSCP_TOTP environment variables.

host: "127.0.0.1"
port: 9443
prefer_ipv6: false
require_tls: false  # set true in production (server must have TLS certs)

# TLS identity (mTLS).  Paths are relative to the repo root.
# ca_file: "security/certs/ca.crt"
# certfile: "security/certs/client.crt"
# keyfile: "security/certs/client.key"

ping_interval: 20.0
idle_timeout: 60.0
connect_timeout: 8.0
reconnect_backoff_base: 1.0
reconnect_backoff_max: 30.0

client_id: "cscp-py-client"
device_name: "cscp-py"
capabilities: ["e2ee", "files", "channels", "sync"]

data_dir: "data/client"